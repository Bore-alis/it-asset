# 로컬 데모용 구성. 실제 운영에서는 PostgreSQL 이 호스트에서 동작했고,
# TLS 는 앞단 로드밸런서가 종료했다.
name: it-asset

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assetdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/assetdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_WIPE_UPLOAD_DIR: /app/uploads/wipe
    volumes:
      # 이 마운트가 없으면 재배포 시 증적 첨부파일이 모두 사라진다
      - uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8001:8001"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  dbdata:
  uploads:
