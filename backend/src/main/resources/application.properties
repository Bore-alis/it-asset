# =============================================================================
# 이 파일에는 실제 접속 정보를 넣지 않습니다.
# 모든 값은 환경변수로 덮어씁니다 (Spring relaxed binding: app.ldap.url <- APP_LDAP_URL).
# 예시 값은 deploy/.env.example 참고.
# =============================================================================
spring.application.name=it-asset
server.port=8080

# --- Database (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assetdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- MyBatis ---
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# --- Mail (SMTP) ---
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
app.mail.cc=${APP_MAIL_CC:}

# --- Active Directory (LDAP) ---
app.ldap.url=${APP_LDAP_URL:ldap://ad.example.local:389}
app.ldap.domain=${APP_LDAP_DOMAIN:@example.local}
app.ldap.allowed-ou-base=${APP_LDAP_ALLOWED_OU_BASE:OU=IT,DC=example,DC=local}

# --- Synology NAS (여러 대면 devices[1], devices[2] ... 로 추가) ---
synology.nas.devices[0].name=${NAS0_NAME:SAMPLE-NAS}
synology.nas.devices[0].url=${NAS0_URL:https://nas.example.local:5001}
synology.nas.devices[0].username=${NAS0_USERNAME:}
synology.nas.devices[0].password=${NAS0_PASSWORD:}

# --- 퇴직자 초기화 증적 ---
app.wipe.upload-dir=${APP_WIPE_UPLOAD_DIR:uploads/wipe}
app.wipe.retention-years=${APP_WIPE_RETENTION_YEARS:3}
app.wipe.purge-cron=${APP_WIPE_PURGE_CRON:0 0 3 * * *}
